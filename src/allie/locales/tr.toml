# {name} is the app as the Store lists it and {publisher} who made it - said
# out loud because the Store is full of look-alikes. The word below stands
# in for a publisher the Store did not name.
store_install_confirm = "'{name}' ({publisher}) Microsoft Store'dan indirilecek."
unknown_publisher = "yayıncısı bilinmiyor"
# Asked before a message goes (2026-09-15); {text} is the message word for
# word, {contact} the person as the user said them, {app} WhatsApp or
# Telegram. The hint on how to answer is added after it.
send_message_confirm = "'{text}' mesajı {contact} kişisine {app} üzerinden gönderilecek."
