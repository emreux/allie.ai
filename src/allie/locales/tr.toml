# Turkish (design.md 3.12). One of the two locales phase 1 ships complete.
#
# Comments here are English because they are notes to whoever edits the file;
# the values are Turkish because they are what the user reads and hears.
# `_template.toml` explains what each key is for.

code = "tr"
name = "Türkçe"

[stt]
language = "tr"

[speech]
# What the confirmation window listens for (design.md 3.1 rule 2). Whole
# words, any case; a "no" anywhere in the answer wins over a "yes".
yes_words = ["evet", "onaylıyorum", "tamam", "olur"]
no_words = ["hayır", "iptal", "vazgeç", "olmaz"]
# Said while a tool takes its time (design.md 4): short, and ending in a
# pause. Used in turn, so two of them are not the same one twice.
filler = ["Bir saniye, bakıyorum...", "Hemen bakıyorum..."]

[live]
# The two hints the live model needs (plan.md D19, ADR-001 section 6). The
# BCP-47 code goes to the session, for the recogniser behind the model and
# for its voice; the sentence goes into the system prompt. Measured
# 2026-09-18: without them a short or quiet "Saat kaç" is heard as Hindi and
# answered in it; with them 14 of 14 sentences came back Turkish. The
# sentence is English because the prompt is: it names the language, it is
# not written in it.
language_code = "tr-TR"
user_language_rule = "The user speaks Turkish. A short or quiet utterance is Turkish unless it is unmistakably another language; never switch languages on a guess."

[probe]
# The one question the setup wizard puts to a model to see whether it calls
# a tool (design.md 3.2): it has to be something the model cannot answer
# from memory, so that the only good answer is to call get_current_time.
# In Turkish, so that the same request shows the model understands it.
question = "İstanbul'da saat kaç?"

[tts.voice]
# Tolga is the voice Windows itself ships for Turkish. It lives in the
# Speech_OneCore registry hive, which `tts/sapi.py` reads on purpose.
sapi = "Tolga"
# Google's synthesiser (`[tts] provider = "gemini"`): the thirty voices read
# every language, so this is a matter of timbre. Kore is a clear, even
# female voice; Charon a calm male one.
gemini = "Kore"

