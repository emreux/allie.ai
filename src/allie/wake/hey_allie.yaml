# The "hey Allie" wake word of allie.ai (plan.md D21), trained with
# livekit-wakeword 0.2.1 from its configs/prod.yaml. One model per name:
# only the one the user chose in setup is ever loaded (`[wake] model`).
#
#   apt-get install -y espeak-ng
#   pip install "livekit-wakeword[train,export]"
#   livekit-wakeword setup --config hey_allie.yaml
#   livekit-wakeword run hey_allie.yaml
#   -> output/hey_allie/hey_allie.onnx, output/hey_allie/hey_allie_eval.json
#
# Version 2 (2026-09-24). Version 1 - "hey allie" and "hey ali" alone -
# woke to American voices (0.97-0.99, even to "hey Kelly") and hardly ever
# to a Turkish speaker: the owner's real attempts scored 0.01-0.66, and a
# recogniser heard most of them as "hey Ellie". Neither the level nor the
# microphone was the cause: clean clips played into the same microphone
# scored 0.99. The three names that do wake to the owner were trained with
# spellings that mimic Turkish stress; this one had none.
#
# The spellings, and what the synthesiser is really given (espeak en-us,
# checked 2026-09-24): "allie" AE L IY as an English speaker says it,
# "ellie" EH L IY as a Turkish one reads it, "ali" AA L IY, and the three
# Turkish readings with the stress on the last syllable - "el lee" (Elli),
# "eh lee" (Eli), "ah lee" (Ali). They are written in pieces because the
# words themselves come out wrong: the toolkit splits "elli" into "el li",
# which espeak says as "el lie", and reads "eli" as "ih-lee".
model_name: hey_allie
target_phrases: ["hey allie", "hey ellie", "hey ali", "hey el lee", "hey eh lee", "hey ah lee"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# What must NOT wake it: the name without "hey" (so the phrase is the
# trigger, not the name), and words that share its ending but not its
# beginning. "hey holly" is not here: with its h swallowed it is "hey ali".
custom_negative_phrases:
  - "allie"
  - "ellie"
  - "call allie"
  - "tell allie"
  - "hey valley"
  - "hey rally"
  - "hey sally"
  - "hey callie"
  - "hey jolly"
  - "hey golly"
  - "hey alexa"
  - "hey alibi"
  - "hey allied"
  - "hey already"
  - "hey family"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
