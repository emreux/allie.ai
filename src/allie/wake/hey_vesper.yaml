# The "hey Vesper" wake word of allie.ai (plan.md D21), trained with
# livekit-wakeword 0.2.1 from its configs/prod.yaml. One model per name:
# only the one the user chose in setup is ever loaded (`[wake] model`).
#
#   apt-get install -y espeak-ng
#   pip install "livekit-wakeword[train,export]"
#   livekit-wakeword setup --config hey_vesper.yaml
#   livekit-wakeword run hey_vesper.yaml
#   -> output/hey_vesper/hey_vesper.onnx, output/hey_vesper/hey_vesper_eval.json
#
# The best-isolated of the four names: CMUDict holds four words that rhyme
# with "vesper" against fifty-eight for "allie" (measured 2026-09-22), and
# the v+sp cluster hardly occurs in speech. The spellings, and what the
# toolkit will really say: "vesper" V EH S P ER, "ves per" the two pieces
# with the stress a Turkish speaker puts on the second, and "vesperr",
# which espeak reads by its own rules.
#
# "whisper" (W IH S P ER) is the one word close enough to steal a wake, so
# it leads the negatives.
model_name: hey_vesper
target_phrases: ["hey vesper", "hey ves per", "hey vesperr"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# What must NOT wake it: the name without "hey" (so the phrase is the
# trigger, not the name), and what sounds like the phrase.
custom_negative_phrases:
  - "vesper"
  - "call vesper"
  - "tell vesper"
  - "hey whisper"
  - "hey whispers"
  - "hey jasper"
  - "hey casper"
  - "hey pepper"
  - "hey prosper"
  - "hey vespa"
  - "hey wasp"
  - "hey vector"
  - "hey master"
  - "hey sister"
  - "hey server"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
